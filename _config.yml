# Site settings
title: "Yosuf Soliman — Mechatronics Engineer"
description: "Portfolio showcasing robotics, autonomous drones, embedded systems, and AI control projects"
url: "https://Yosuf-Soliman.github.io"
baseurl: "/Portfolio"
author: "Yosuf Soliman"
email: "yossuf.osama@gmail.com"
github_username: "Yosuf-Soliman"
linkedin_username: "yossuf-osama075295326"
twitter_username: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Autonomous robots and robotic systems"
  - name: "Mechatronics"
    slug: "mechatronics"
    description: "Integration of mechanical, electrical, and software systems"
  - name: "Drones"
    slug: "drones"
    description: "Autonomous UAV systems and flight control"
  - name: "AI & Control"
    slug: "ai-control"
    description: "Reinforcement learning, computer vision, and control systems"
  - name: "Embedded Systems"
    slug: "embedded"
    description: "Arduino, ESP32, PLC, and low-level hardware"
  - name: "Simulation"
    slug: "simulation"
    description: "MATLAB, Simulink, Gazebo, and SITL"
  - name: "Arduino"
    slug: "arduino"
    description: "Arduino-based projects and prototypes"
  - name: "3D Printing"
    slug: "3d-printing"
    description: "Custom 3D printed components and designs"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#0D0F14"
  camera_controls: true
  auto_rotate: true

# Schematic settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
